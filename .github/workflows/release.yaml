name: Release AEL binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # JOB level, not step level. A step-level env is scoped to that step alone
    # and is not inherited by later steps, so setting this on the gates step
    # left the vulnerability scan and the GoReleaser build on the default
    # GOTOOLCHAIN=auto. Either could then download and use a different compiler
    # than the pin selects: govulncheck source mode analyses with whatever `go`
    # is on PATH, and GoReleaser passes its own environment through to
    # `go build`. A guard covering one of three Go commands is not a guard.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pin the EXACT patch that builds published binaries. `1.25.x` was
      # considered and rejected as a near no-op: setup-go resolves both a
      # patchless `go 1.25` directive and `1.25.x` to the same latest 1.25
      # patch, so it restates the policy without freezing anything.
      #
      # The pin exists so the toolchain that builds a published binary is a
      # decision rather than whatever was newest that day, and so the version
      # the binaries self-report is predictable. It cannot rot silently: the
      # govulncheck gate below fails the release when this patch acquires a
      # reachable vulnerability, which forces a deliberate bump.
      #
      # The consumer floor in go.mod stays unpinned on purpose: a patch pin
      # there would force a toolchain download on anyone building the checker
      # from source, which an independent-verification project cannot afford,
      # and it would not stop an old patch of a newer minor.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      - name: Run release gates
        shell: bash
        run: |
          set -euo pipefail
          # The pin above SELECTS a toolchain; this asserts the one actually
          # running is that toolchain. A pin nothing verifies is a claim, and
          # this repository's whole subject is the difference between a recorded
          # claim and a verified one.
          go version | grep -qF 'go1.26.9 ' || { echo "toolchain drift: $(go version), expected go1.26.9"; exit 1; }
          go vet ./...
          go test ./...
          make check

      - name: Reject reachable vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/govulncheck-bin"
          GOBIN="$tool_dir" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$tool_dir/govulncheck" -db https://vuln.go.dev -mode=source ./...

      - name: Install pinned GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          install-only: true

      - name: Build release assets
        shell: bash
        run: goreleaser release --clean

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name '*.tar.gz' -print | sort)
          [[ "${#archives[@]}" -eq 4 ]]
          for archive in "${archives[@]}"; do
            listing="$(tar -tzf "$archive")"
            grep -Eq '(^|/)aelcheck$' <<<"$listing"
            grep -Eq '(^|/)aelgen$' <<<"$listing"
            grep -Eq '(^|/)aelpackage$' <<<"$listing"
          done
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-evidence-levels-release-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  attest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-evidence-levels-release-${{ github.sha }}
          path: release-assets

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

  publish:
    needs: [build, attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download attested release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-evidence-levels-release-${{ github.sha }}
          path: release-assets

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
